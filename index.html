<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurdistan Electricity Bill Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .calculator-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #219653;
        }
        .result-section {
            margin-top: 25px;
            border-top: 2px solid #eee;
            padding-top: 15px;
            display: none;
        }
        .breakdown-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
            color: #555;
            border-bottom: 1px solid #f9f9f9;
            padding-bottom: 8px;
        }
        .total-row {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 2px dashed #ccc;
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <h2>Electricity Bill Calculator</h2>
    <div class="input-group">
        <label for="kwhInput">Enter Total Consumption (kWh):</label>
        <input type="number" id="kwhInput" placeholder="e.g. 1731">
    </div>
    <button onclick="calculateBill()">Calculate Bill</button>

    <div class="result-section" id="resultSection">
        <h3>Breakdown:</h3>
        <div id="breakdownList"></div>
        <div class="total-row">
            <span>Total Cost:</span>
            <span id="totalCostResult">0 IQD</span>
        </div>
    </div>
</div>

<script>
    function formatNumber(num) {
        return num.toLocaleString('en-US', {maximumFractionDigits: 2});
    }

    function calculateBill() {
        let kwh = parseFloat(document.getElementById('kwhInput').value);
        const resultSection = document.getElementById('resultSection');
        const breakdownList = document.getElementById('breakdownList');
        const totalCostResult = document.getElementById('totalCostResult');

        if (isNaN(kwh) || kwh <= 0) {
            alert('Please enter a valid consumption value greater than 0.');
            return;
        }

        let remaining = kwh;
        let totalCost = 0;
        let htmlContent = '';

        const tiers = [
            { limit: 400, rate: 72, label: '1 - 400 kWh' },
            { limit: 400, rate: 108, label: '401 - 800 kWh' },
            { limit: 400, rate: 175, label: '801 - 1,200 kWh' },
            { limit: 400, rate: 265, label: '1,201 - 1,600 kWh' },
            { limit: Infinity, rate: 350, label: '1,601+ kWh' }
        ];

        for (let tier of tiers) {
            if (remaining <= 0) break;
            let usage = Math.min(remaining, tier.limit);
            let cost = usage * tier.rate;
            totalCost += cost;

            htmlContent += `
                <div class="breakdown-row">
                    <span>${tier.label}<br><small>${formatNumber(usage)} kWh × ${tier.rate} IQD</small></span>
                    <span style="font-weight: bold; align-self: center;">${formatNumber(cost)} IQD</span>
                </div>
            `;
            remaining -= usage;
        }

        breakdownList.innerHTML = htmlContent;
        totalCostResult.innerText = formatNumber(totalCost) + ' IQD';
        resultSection.style.display = 'block';
    }
</script>

</body>
</html>
